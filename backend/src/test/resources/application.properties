# Configuración común a los tests de integración.
#
# El job de sincronización de feriados (RF-38) queda APAGADO: un test no puede depender de que
# responda un servicio externo, ni puede salir a internet en CI. La lógica del sincronizador se
# prueba contra un doble del cliente, y el parseo contra el archivo oficial real servido desde
# un servidor local (ver FeriadosOficialesFormatoRealTest).
vitalys.feriados.habilitado=false

# La URL apunta a un host inexistente a propósito: si algún test intentara sincronizar sin
# querer, falla rápido en lugar de pegarle a argentina.gob.ar.
vitalys.feriados.url-plantilla=http://localhost:1/holidays-{anio}-es.json
vitalys.feriados.timeout-segundos=2
