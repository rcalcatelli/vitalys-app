name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Devolución de la 2.ª entrega (punto 8): el README afirmaba que los nombres estaban
  # unificados, pero la documentación citaba restricciones y triggers que no existían con
  # esos nombres. No había forma de detectarlo salvo leyendo, así que se automatizó:
  # el script levanta un Postgres, aplica las migraciones y contrasta cada identificador
  # citado en los .md, .sql y .java contra el catálogo real del motor.
  consistencia-docs:
    name: Consistencia de la documentación (nombres de BD + fechas)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Docker es nativo en ubuntu-latest; el script levanta y elimina su propio contenedor.
      - name: Verificar identificadores
        run: python scripts/verificar-nombres-db.py

      # Devolución de la 2.ª entrega (punto 9): los wireframes mostraban fechas que no
      # caían en el día de la semana que decían. Nadie calcula días mientras lee, así que
      # también se automatizó. No necesita Docker.
      - name: Verificar fechas y días de la semana
        run: python scripts/verificar-fechas-docs.py

  backend:
    name: Backend (Maven verify + JaCoCo gate 0.90)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # `mvn verify` corre unit tests (Surefire) + integración con
      # Testcontainers (Failsafe, requiere Docker — nativo en ubuntu-latest)
      # y aplica el gate de JaCoCo (BUNDLE/LINE/COVEREDRATIO >= 0.90).
      # El build falla si la cobertura no llega al umbral.
      - name: mvn verify
        run: mvn -B verify

      # Publica el reporte HTML/CSV de JaCoCo como artifact del build, incluso cuando el gate
      # de cobertura falla (if: always()) — antes la única forma de ver el número real era
      # grepear una línea de warning del log de Maven.
      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: warn

  frontend:
    name: Frontend (build + Vitest coverage gate 0.90)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # `vitest run --coverage` corre la suite completa y aplica el gate de cobertura
      # (líneas >= 0.90, ver `coverage.thresholds` en vite.config.ts) — mismo umbral que
      # el gate de JaCoCo del backend. El build falla si no se alcanza.
      - name: Test (Vitest + coverage)
        run: npm run test

      # Publica el reporte HTML/lcov de Vitest como artifact del build, incluso cuando
      # el gate de cobertura falla (if: always()) — mismo criterio que el artifact de
      # JaCoCo del job `backend`.
      - name: Upload Vitest coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage-report
          path: frontend/coverage/
          if-no-files-found: warn
