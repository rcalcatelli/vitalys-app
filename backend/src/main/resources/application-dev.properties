# Perfil local. Ningún secreto hardcodeado: todos los valores vienen de variables de entorno.
# DB_URL: si no está seteada, cae a un Postgres local de desarrollo (sin credenciales reales).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vitalys}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

vitalys.jwt.secret=${JWT_SECRET}
vitalys.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
