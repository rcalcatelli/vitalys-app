# Blueprint de despliegue para Render — backend Spring Boot (Vitalys App).
#
# Los secretos (DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET) se cargan a mano
# en el dashboard de Render (sync: false) — nunca quedan escritos en este archivo.
# Pasos detallados: docs/03-despliegue/runbook-deploy.md
services:
  - type: web
    name: vitalys-backend
    # Render no tiene un runtime nativo de Java: sus runtimes son docker, node,
    # python, ruby, go, rust, elixir y static. Se usa Docker, que además reutiliza
    # exactamente la misma imagen que corre en local con docker compose.
    runtime: docker
    plan: free
    # El contexto es la RAÍZ del repo, no backend/: el Dockerfile hace
    # `COPY db/migration ./db/migration`, y esas migraciones viven fuera de backend/.
    # Con rootDir: backend ese COPY no encontraría nada y el build fallaría.
    # Es el mismo contexto que usa docker-compose.yml (`context: .`).
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MS
        value: "86400000"
