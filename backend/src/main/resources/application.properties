spring.application.name=vitalys-backend
server.port=8080

# T1-5 / design.md §6: ddl-auto=validate — el esquema lo gestiona Flyway (db/migration),
# Hibernate solo valida que las entidades coincidan, nunca genera ni migra el esquema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway aplica las migraciones versionadas al arrancar. "classpath:db/migration" es el
# location por defecto; se deja explícito porque backend/pom.xml copia ahí los archivos de
# db/migration/ (raíz del repo) en cada build (ver docs/03-despliegue/entorno-local-docker.md).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Swagger UI / OpenAPI (ver OpenApiConfig), habilitado en dev y en prod: la tutora evalúa el
# backend desplegado y tener la documentación viva ahí suma. Tradeoff aceptado: expone
# públicamente la forma de la API (no expone secretos ni datos). Apagarlo en producción es
# cambiar estas dos líneas de true a false.
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Sincronización del calendario de feriados (RF-38). La fuente es el dataset "Feriados
# Nacionales" del Ministerio del Interior, catalogado en datos.gob.ar. Se sincroniza todos
# los días a las 03:00 de Argentina porque el calendario cambia después de publicado: los
# trasladables se corren por decreto anual y pueden declararse feriados nuevos en cualquier
# momento. La reserva de turnos NUNCA consulta esta API: lee la tabla `feriados`.
vitalys.feriados.url-plantilla=https://www.argentina.gob.ar/sites/default/files/holidays-{anio}-es.json
vitalys.feriados.habilitado=true
vitalys.feriados.cron=0 0 3 * * *
vitalys.feriados.zona=America/Argentina/Buenos_Aires
vitalys.feriados.anios-a-sincronizar=2
vitalys.feriados.timeout-segundos=20
