# Perfil Render/Supabase. Ningún secreto hardcodeado: todos los valores vienen de variables de
# entorno (ver render.yaml, Track C). DB_URL debe apuntar al "Session pooler" de Supabase
# (puerto 5432), no al "Transaction pooler" (6543) — ver riesgo PgBouncer en design.md §6.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

vitalys.jwt.secret=${JWT_SECRET}
vitalys.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
