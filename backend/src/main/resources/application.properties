spring.application.name=vitalys-backend
server.port=8080

# T1-5 / design.md §6: ddl-auto=validate — el esquema lo gestiona db/ddl/vitalys_ddl.sql,
# Hibernate solo valida que las entidades coincidan, nunca genera ni migra el esquema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
